<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/list_vehicle.css?=time()">
    <title>List of Vehicles</title>
</head>
<body>
    <header>
        <img id="nav-toggle" src="../icon/list.png">
        <img src="../img/ebooking.png" alt="Logo KKSB">
    </header>

    <!-- side bar -->
    <section class="sidenav">
    <h1>Navigation</h1>
        <div class="wrapper-nav">
            <label>
                <ul>
                    <li><a href="super_homepage.php"><img src="../icon/home.png"> Homepage</a></li>
                    <li><a href="#"><img src="../icon/calendar.png"> View calendar</a></li>
                    <li><a href="#" id="logout"><img src="../icon/logout.png"> Logout</a></li>
                </ul>
            </label>
        </div>
    </section>

    <section class="content">
        <main>
            <button type="button" id="add-vehicle">+ Add Vehicle</button>

            <form action="" id="mainForm">
                <input type="text" name="search" id="search">
                <button type="submit">Search</button>
            </form>

            <div class="wrapper-list">
                <table class="vehicle-list">
                </table>
            </div>

        </main>
    </section>

    <footer>
        <p><b>Hak Milik : KOLEJ KOMUNITI SABAK BERNAM</b></p>
    </footer>

    <dialog class="modal">
        <h1 class="modal-h1"></h1>
        <p class="modal-text"></p>
        <br>
        <button id="modal-button" type="button">Ok</button>
    </dialog>
    
    <dialog class="logout-pop-up">
        <h1>Logout</h1>
        <form id="logout-form" method="dialog">
            <p>Are you sure you want to logout?</p>
            <br>
            <div class="wrapper-buttons">
                <button id="logout-cancel" type="button">No</button>
                <button type="submit">Yes</button>
            </div>
        </form>
    </dialog>
    
    <dialog class="modal-error">
        <h1>Error</h1>
        <p class="modal-p-error"></p>
        <br>
        <button id="error-button">Ok</button>
    </dialog>

    <script src="../JS/module.js?=time()"></script>
    <script src="../JS/list_vehicle.js?=time()"></script>
</body>
</html>
