<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/admin_view_eken.css?=time()">
    <title>View eKenderaan Form</title>
</head>
<body>
    <header>
        <img id="nav-toggle" src="../icon/list.png">
        <img src="../img/ebooking.png" alt="Logo KKSB">
    </header>
    <!-- side bar -->
    <section class="sidenav">
        <h1>Navigation</h1>
        <div class="wrapper-nav">
            <label>
                <ul>
                    <li><a href="homepage.php"><img src="../icon/home.png"> Homepage</a></li>
                    <li><a href="view_status.php"><img src="../icon/check-list.png"> View Status</a></li>
                    <li><a href="edit_profile.php"><img src="../icon/calendar.png"> View calendar</a></li>
                    <li><a href="#"><img src="../icon/editing.png"> Edit Profile</a></li>
                    <li><a href="#" id="logout"><img src="../icon/logout.png"> Logout</a></li>
                </ul>
            </label>
        </div>
        </section>

    <section class="content">
        <main>
            <div class="wrapper-form">
                <form action="#" method="post" enctype="multipart/form-data">
                    <div class="upper-form">
                        <label for="purpose"><b>Purpose</b></label>
                        <input type="text" name="purpose" id="purpose">
    
                        <label for="destination"><b>Destination</b></label>
                        <input type="text" name="destination" id="destination">
    
    
                        <label for=""><b>Vehicle</b></label>
                        <table class="list-vehicle">
                        </table>
                    </div>

                    <div class="lower-form">
                        <label for=""><b>Departure</b></label>
                        <div class="wrapper-date-time">
                            <div class="date-time">
                                <label for="depDate">Date:</label>
                                <input type="date" name="depDate" id="depDate">
                            </div>
                            <div class="date-time">
                                <label for="depTime">Time:</label>
                                <input type="time" name="depTime" id="depTime">
                            </div>
                        </div>
    
                        <label for=""><b>Return</b></label>
                        <div class="wrapper-date-time">
                            <div class="date-time">
                                <label for="retDate">Date:</label>
                                <input type="date" name="retDate" id="retDate">
                            </div>
                            <div class="date-time">
                                <label for="retTime">Time:</label>
                                <input type="time" name="retTime" id="retTime">
                            </div>
                        </div>
    
                        <label for=""><b>Start</b></label>
                        <div class="wrapper-date-time">
                            <div class="date-time">
                                <label for="staDate">Date:</label>
                                <input type="date" name="staDate" id="staDate">
                            </div>
                            <div class="date-time">
                                <label for="staTime">Time:</label>
                                <input type="time" name="staTime" id="staTime">
                            </div>
                        </div>
    
                        <label for="file"><b>File</b></label>
                        <div class="file">
                            <a href="#">File name</a>
                        </div>
                    </div>
                    
                </form>
            </div>

            <div class="wrapper-form">
                <form id="mainForm" action="">
                    <div class="upper-form">
                        <label for=""><b>Vehicles' Availablity</b></label>
                        <table>
                            <tr>
                                <td>
                                    <input type="radio" name="availablity" id="available" value="available"><label for="available">Available</label>
                                </td>
                                <td>
                                    <input type="radio" name="availablity" id="unavailable" value="unavailable"><label for="unavailable">Unavailable</label>
                                </td>
                            </tr>
                        </table>

                        <br>

                        <div class="header-driver">
                            <div>
                                <label for=""><b>Driver's Name</b></label>
                            </div>
                            <div>
                                <button type="button" id="add-driver">+</button>
                            </div>
                        </div>
                        <div class="driver-list">
                            <div class="driver">
                                <input type="text" name="driver[]" placeholder="Enter the driver's name">
                                <a href="#" class="remove" style="background-color: gray;">-</a>
                            </div>
                        </div>
                    </div>
                    <div class="lower-form">
                        <label for=""><b>Recommend Vehicle</b></label>
                        <table class="rec-vehicle">
                        </table>

                        <label for=""><b>Approval</b></label>
                        <table>
                            <tr>
                                <td>
                                    <input type="radio" name="status" id="approved" value="approved"><label for="approved">Approve</label>
                                </td>
                                <td>
                                    <input type="radio" name="status" id="denied" value="denied"><label for="denied">Deny</label>
                                </td>
                            </tr>
                        </table>

                        <br>

                        <button type="submit">Submit</button>
                    </div>
                </form>
            </div>
        </main>
    </section>

    <footer>
        <p><b>Hak Milik : KOLEJ KOMUNITI SABAK BERNAM</b></p>
    </footer>

    <dialog class="modal">
        <h1 class="modal-h1"></h1>
        <p class="modal-text"></p>
        <br>
        <div class="wrapper-button">
            <button id="modal-button" type="button">Ok</button>
        </div>
    </dialog>
    
    <dialog class="logout-pop-up">
        <h1>Logout</h1>
        <form id="logout-form" method="dialog">
            <p>Are you sure you want to logout?</p>
            <br>
            <div class="wrapper-button">
                <button id="logout-cancel" type="button">No</button>
                <button type="submit">Yes</button>
            </div>
        </form>
    </dialog>

    <dialog class="modal-success">
        <h1>Success</h1>
        <p class="success-text"></p>
        <br>
        <div class="wrapper-button">
            <button id="success-button" type="button">Ok</button>
        </div>
    </dialog>
    
    <dialog class="modal-error">
        <h1>Error</h1>
        <p class="modal-p-error"></p>
        <br>
        <div class="wrapper-button">
            <button id="error-button">Ok</button>
        </div>
    </dialog>


    <script src="../JS/module.js?=time()"></script>
    <script src="../JS/admin_view_eken.js?=time()"></script>
</body>
</html>
