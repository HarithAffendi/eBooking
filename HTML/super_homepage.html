<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/super_homepage.css?=time()">
    <title>Super Admin Homepage</title>
</head>
<body>
    <header>
        <img id="nav-toggle" src="../icon/list.png">
        <img src="../img/ebooking.png" alt="Logo KKSB">
    </header>
    <!-- side bar -->
    <section class="sidenav">
    <h1>Navigation</h1>
        <div class="wrapper-nav">
            <label>
                <ul>
                    <li><a href=""><img src="../icon/home.png"> Homepage</a></li>
                    <li><a href=""><img src="../icon/check-list.png"> View Status</a></li>
                    <li><a href=""><img src="../icon/calendar.png"> View calendar</a></li>
                    <li><a href="" id="logout"><img src="../icon/logout.png"> Logout</a></li>
                </ul>
            </label>
        </div>
    </section>

    <section class="content">
        <main>
            <div class="apps">
                <h1>Apps</h1>
                <div class="apps-inner">
                    <div class="wrapper-img">
                        <a href=""></a><img src="../img/eFasiliti1.png" id="efas">
                        <br>
                        <label for="efas">e-Fasiliti</label>
                    </div>
                    <div class="wrapper-img">
                        <a href=""></a><img src="../img/eICT.png" id="eict">
                        <br>
                        <label for="eict">e-ICT</label>
                    </div>
                    <div class="wrapper-img">
                        <a href=""></a><img src="../img/eKenderaan.png" id="eken">
                        <br>
                        <label for="eken">e-Kenderaan</label>
                    </div>
                </div>
            </div>

            <div class="other">
                <h1>Manage</h1>
                <div class="other-inner">
                    <div class="wrapper-img">
                        <a href=""></a><img src="../img/work-group.png" id="staff">
                        <br>
                        <label for="staff">Staff</label>
                    </div>
                    <div class="wrapper-img">
                        <a href=""></a><img src="../img/software-engineer.png" id="adimn">
                        <br>
                        <label for="adimn">Admin</label>
                    </div>
                </div>
            </div>

        </main>
    </section>

    <footer>
        <p><b>Hak Milik : KOLEJ KOMUNITI SABAK BERNAM</b></p>
    </footer>

    <script src="../JS/super_homepage.js?=time()"></script>
</body>
</html>
