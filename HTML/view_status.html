<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/view_status.css?=time()">
    <title>View Status</title>
</head>
<body>
    <header>
        <img id="nav-toggle" src="../icon/list.png">
        <img src="../img/ebooking.png" alt="Logo KKSB">
    </header>
    <!-- side bar -->
    <section class="sidenav">
    <h1>Navigation</h1>
    <div class="wrapper-nav">
        <label>
            <ul>
                <li><a href=""><img src="../icon/home.png"> Homepage</a></li>
                <li><a href=""><img src="../icon/check-list.png"> View Status</a></li>
                <li><a href=""><img src="../icon/calendar.png"> View calendar</a></li>
                <li><a href=""><img src="../icon/editing.png"> Edit Profile</a></li>
                <li><a href=""><img src="../icon/logout.png"> Logout</a></li>
            </ul>
        </label>
    </div>
    </section>

    <section class="content">
        <main>
            <div class="eFasiliti">
                <h1>eFasiliti</h1>
                <table class="eFas-list">
                    <div class="no-result">
                        <img src="../icon/folder.png" alt="no result">
                        <p><b>No result</b></p>
                    </div>
                </table>
            </div>
            
            <div class="eICT">
                <h1>eICT</h1>
                <table class="eICT-list">
                    <div class="no-result">
                        <img src="../icon/folder.png" alt="no result">
                        <p><b>No result</b></p>
                    </div>
                </table>
            </div>
            
            <div class="eKenderaan">
                <h1>eKenderaan</h1>
                <table class="eKen-list">
                    <tr>
                        <td style="width: 80%;">pemohonan kenderaan ke pesta buku</td>
                        <td style="width: 10%;">Pending</td>
                        <td style="width: 10%;"><a href="">View</a></td>
                    </tr>
                    <tr>
                        <td style="width: 80%;">pemohonan kenderaan ke pesta buku</td>
                        <td style="width: 10%;">Pending</td>
                        <td style="width: 10%;"><a href="">View</a></td>
                    </tr>
                </table>
            </div>

        </main>
    </section>

    <footer>
        <p><b>Hak Milik : KOLEJ KOMUNITI SABAK BERNAM</b></p>
    </footer>

    <dialog class="modal">
        <h1 class="modal-h1"></h1>
        <p class="modal-text"></p>
        <br>
        <div class="wrapper-button">
            <button id="modal-button" type="button">Ok</button>
        </div>
    </dialog>
    
    <dialog class="logout-pop-up">
        <h1>Logout</h1>
        <form id="logout-form" method="dialog">
            <p>Are you sure you want to logout?</p>
            <br>
            <div class="wrapper-button">
                <button id="logout-cancel" type="button">No</button>
                <button type="submit">Yes</button>
            </div>
        </form>
    </dialog>

    <dialog class="modal-success">
        <h1>Success</h1>
        <p class="success-text"></p>
        <br>
        <div class="wrapper-button">
            <button id="success-button" type="button">Ok</button>
        </div>
    </dialog>
    
    <dialog class="modal-error">
        <h1>Error</h1>
        <p class="modal-p-error"></p>
        <br>
        <div class="wrapper-button">
            <button id="error-button">Ok</button>
        </div>
    </dialog>

<script src="../JS/view_status.js?=time()"></script>
</body>
</html>
