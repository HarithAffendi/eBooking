<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/view_vehicle.css?=time()">
    <title>View Vehicle</title>
</head>
<body>
    <header>
        <img id="nav-toggle" src="../icon/list.png">
        <img src="../img/ebooking.png" alt="Logo KKSB">
    </header>

    <!-- side bar -->
    <section class="sidenav">
    <h1>Navigation</h1>
        <div class="wrapper-nav">
            <label>
                <ul>
                    <li><a href="super_homepage.php"><img src="../icon/home.png"> Homepage</a></li>
                    <li><a href="#"><img src="../icon/calendar.png"> View calendar</a></li>
                    <li><a href="#" id="logout"><img src="../icon/logout.png"> Logout</a></li>
                </ul>
            </label>
        </div>
    </section>

    <section class="content">
        <main>
            <div class="wrapper-form">
                <h1>Vehicle details</h1>
                <form id="mainForm" action="../include/update_vehicle.inc.php" method="post">
                    <div class="wrapper-input">
                        <label for="v_id">Vehicle's ID</label>
                        <input type="text" name="v_id" id="v_id" readonly>
                    </div>

                    <div class="wrapper-input">
                        <label for="name">Vehicle's Name</label>
                        <input type="text" name="name" id="name" placeholder="Enter the vehicle's name">
                    </div>
                    <div class="wrapper-error">
                        <span class="error name-error"></span>
                    </div>
    
                    <div class="wrapper-input">
                        <label for="plate">Plate Number</label>
                        <input type="text" name="plate" id="plate" placeholder="Enter the vehicle's plate number">
                    </div>
                    <div class="wrapper-error">
                        <span class="error plate-error"></span>
                    </div>
    
                    
                    <br>
                    <button type="button" id="del">Delete</button>
                    <button type="reset">Reset</button>
                    <button type="submit">Save</button>
    
                </form>
            </div>
        </main>
    </section>

    <footer>
        <p><b>Hak Milik : KOLEJ KOMUNITI SABAK BERNAM</b></p>
    </footer>

    <dialog class="modal">
        <h1 class="modal-h1"></h1>
        <p class="modal-text"></p>
        <br>
        <div class="wrapper-button">
            <button id="modal-button" type="button">Ok</button>
        </div>
    </dialog>
    
    <dialog class="logout-pop-up">
        <h1>Logout</h1>
        <form id="logout-form" method="dialog">
            <p>Are you sure you want to logout?</p>
            <br>
            <div class="wrapper-button">
                <button id="logout-cancel" type="button">No</button>
                <button type="submit">Yes</button>
            </div>
        </form>
    </dialog>

    <dialog class="modal-success">
        <h1>Success</h1>
        <p class="success-text"></p>
        <br>
        <div class="wrapper-button">
            <button id="success-button" type="button">Ok</button>
        </div>
    </dialog>
    
    <dialog class="modal-error">
        <h1>Error</h1>
        <p class="modal-p-error"></p>
        <br>
        <div class="wrapper-button">
            <button id="error-button">Ok</button>
        </div>
    </dialog>

    <dialog class="delete-confirmation">
        <h1>Delete Confirmation</h1>
        <p>Are you sure you want to <b>delete</b> this admin?</p>
        <br>
        <div class="wrapper-button">
            <button id="yes-delete" type="button">Yes</button>
            <button id="no-delete" type="button">No</button>
        </div>
    </dialog>

    <script src="../JS/module.js?=time()"></script>
    <script src="../JS/view_vehicle.js?=time()"></script>
</body>
</html>
